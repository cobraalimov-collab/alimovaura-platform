const $ = (s, r = document) => r.querySelector(s);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  kids.flat().forEach((c) => { if (c != null) n.append(c); });
  return n;
}
const t = (k) => (I18N[state.lang] && I18N[state.lang][k]) || I18N.en[k] || k;

const fmt = (n) => (Number.isInteger(n) ? String(n) : Number(n).toFixed(2));

const providers = {};

function loadCatalog() {

async function sha256(s) {
  if (!window.crypto || !crypto.subtle) throw new Error("no-subtle");
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}

/* ═══════════════════════════ 8. WALLET ═══════════════════════════ */
let injectedHooked = false;
function hookInjected() {
  if (injectedHooked || !window.ethereum || !window.ethereum.on) return;
  injectedHooked = true;
  window.ethereum.on("accountsChanged", (accs) => {
    if (state.wallet !== "injected") return;
    state.owned = {};
    state.account = accs && accs[0] && hasEthers() ? ethers.getAddress(accs[0]) : null;
    if (!state.account) { state.wallet = null; state.eip1193 = null; }
    afterWalletChange();
  });
}

async function connectInjected() {
  try {
    if (!window.ethereum) return setStatus("sNoWallet", "err");
    if (!hasEthers()) return setStatus("sNoLib", "err");
    const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
    state.eip1193 = window.ethereum; state.wallet = "injected";
    state.account = ethers.getAddress(accs[0]);
    hookInjected();
    setStatus(null);
    afterWalletChange();
  } catch (e) { explain(e); }
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("script load failed"));
    document.head.append(s);
  });
}
async function connectWC() {
  try {
    if (!CONFIG.walletConnectProjectId) return setStatus("sNoWC", "err");
    if (!hasEthers()) return setStatus("sNoLib", "err");
    if (!window["@walletconnect/ethereum-provider"]) {
      await loadScript("https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.17.0/dist/index.umd.js");
    }
    const { EthereumProvider } = window["@walletconnect/ethereum-provider"];
    const rpcMap = {}; Object.values(CONFIG.chains).forEach((c) => { rpcMap[c.id] = c.rpc; });
    const wc = await EthereumProvider.init({
      projectId: CONFIG.walletConnectProjectId, chains: [137], optionalChains: [56], rpcMap, showQrModal: true,
      metadata: { name: "alimovaura", description: "alimovaura digital products", url: location.origin, icons: [] }
    });
    await wc.connect();
    state.wc = wc; state.eip1193 = wc; state.wallet = "wc";
    state.account = ethers.getAddress(wc.accounts[0]);
    wc.on("disconnect", disconnect);
    setStatus(null);
    afterWalletChange();
  } catch (e) { explain(e); }
}

async function disconnect() {
  try { if (state.wc && state.wc.disconnect) await state.wc.disconnect(); } catch (e) { /* ignore */ }
  state.wc = null; state.eip1193 = null; state.account = null; state.wallet = null; state.owned = {};
  afterWalletChange();
}

function afterWalletChange() {
  renderCatalog();
  if (state.modal) state.modal.render();
  checkAccess();
}

async function ensureChain(c) {
  const cur = await state.eip1193.request({ method: "eth_chainId" });
  if (String(cur).toLowerCase() === c.hex) return;
  setStatus("sSwitching");
  try {
    await state.eip1193.request({ method: "wallet_switchEthereumChain", params: [{ chainId: c.hex }] });
  } catch (e) {
    const code = e && (e.code || (e.data && e.data.originalError && e.data.originalError.code));
    if (code !== 4902) throw e;
    await state.eip1193.request({
      method: "wallet_addEthereumChain",
      params: [{ chainId: c.hex, chainName: c.name, nativeCurrency: c.currency, rpcUrls: [c.rpc], blockExplorerUrls: [c.explorer] }]
    });
  }
}

/* ═══════════════════════════ 9. ON-CHAIN READS ═══════════════════════════ */
async function refreshOnchain() {
  if (!hasEthers()) return;
  const chains = deployedChains();
  if (!chains.length) return;
  const c = chains[0];
  const m = new ethers.Contract(c.contract, MARKET_ABI, readProvider(c));
  await Promise.all(state.catalog.products.map(async (p) => {
    try {
      const r = await m.products(p.id);
      if (r.priceUsd6 > 0n) state.onchain[p.id] = { price: Number(r.priceUsd6) / 1e6, active: r.active };
    } catch (e) { /* product not on chain yet: keep listed price */ }
  }));
  renderCatalog();
}

async function checkAccess() {
  if (!state.account || !hasEthers()) return;
  const acct = state.account;
  const jobs = [];
  for (const c of deployedChains()) {
    for (const p of state.catalog.products) {
      jobs.push((async () => {
        try {
          const m = new ethers.Contract(c.contract, MARKET_ABI, readProvider(c));
          if (await m.hasAccess(acct, p.id)) state.owned[p.id] = c.id;
        } catch (e) { /* RPC hiccup */ }
      })());
    }
  }
  await Promise.all(jobs);
  if (state.account !== acct) return;
  renderCatalog();
  if (state.modal && state.modal.kind === "buy") state.modal.render();
}

const totalText = (p) => "$" + fmt(priceOf(p)) + " " + state.token;

async function buy(p, btn) {
  try {
    if (!state.account) return setStatus("sConnectFirst", "err");
    if (!hasEthers()) return setStatus("sNoLib", "err");
    const c = CONFIG.chains[state.chainId];
    if (!deployed(c)) return setStatus("sNotDeployed", "err");
    btn.disabled = true;

    await ensureChain(c);
    const signer = await new ethers.BrowserProvider(state.eip1193).getSigner();
    const me = await signer.getAddress();
    const tok = c.tokens[state.token];
    const market = new ethers.Contract(c.contract, MARKET_ABI, signer);
    const erc20 = new ethers.Contract(tok.address, ERC20_ABI, signer);

    if (await market.hasAccess(me, p.id)) { state.owned[p.id] = c.id; setStatus("sAlready", "ok"); return afterWalletChange(); }

    const amount = await market.quote(p.id, tok.address);            // price comes from the contract, not from this page
    if ((await erc20.balanceOf(me)) < amount) return setStatus("sBalance", "err");

    if ((await erc20.allowance(me, c.contract)) < amount) {
      setStatus("sApproving");
      await (await erc20.approve(c.contract, amount)).wait();         // exact amount, never unlimited
    }
    setStatus("sBuying");
    const tx = await market.purchase(p.id, tok.address);
    setStatus("sConfirming");
    await tx.wait();

    state.owned[p.id] = c.id;                                         // AccessGranted was emitted → reveal access
    setStatus("sDone", "ok");
    renderCatalog();
    if (state.modal) state.modal.render();
    paintStatus();
  } catch (e) { explain(e); }
  finally { btn.disabled = false; }
}

async function copyText(text, btn) {

  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* ignore */ } ta.remove();
  }
  if (btn) { const old = btn.textContent; btn.textContent = t("copied"); setTimeout(() => { btn.textContent = old; }, 1400); }
}

/* Licence key = wallet signature bound to the phone's device code. Format & message must match LicenseManager.kt. */
function licenseMessage(productId, device, c) {
  return "VoiceAgent License v1\nProduct: " + productId + "\nDevice: " + device + "\nChain: " + c.id + "\nContract: " + c.contract.toLowerCase();
}
async function createLicense(p, keyBox) {
  const device = (state.device || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(device)) { state.sign = { key: "sDeviceBad", kind: "err" }; return; }
  const chainId = state.owned[p.id];
  if (!chainId || !state.account || !hasEthers()) { state.sign = { key: "sNoAccess", kind: "err" }; return; }
  try {
    const c = CONFIG.chains[chainId];
    const signer = await new ethers.BrowserProvider(state.eip1193).getSigner();
    const addr = await signer.getAddress();
    const sig = await signer.signMessage(licenseMessage(p.id, device, c));   // personal_sign (EIP-191)
    keyBox.textContent = ["VA1", c.id, addr, p.id, sig].join(".");
    state.licenseKey = keyBox.textContent;
    state.sign = { key: "sSigned", kind: "ok" };
  } catch (e) {
    state.sign = { key: (e && (e.code === "ACTION_REJECTED" || e.code === 4001)) ? "sRejected" : "sError", kind: "err" };
  }
}

function adminLogin() {
  const pin = el("input", { type: "password", id: "pin", inputmode: "numeric", autocomplete: "off", "aria-label": t("aPinLabel") });
  const msg = el("div", { class: "status err", role: "alert" });
  if (state.admin.msg) msg.textContent = t(state.admin.msg);
  const go = async () => {
    const now = Date.now();
    if (now < state.admin.lockUntil) { state.admin.msg = "aLocked"; return renderAdmin(); }
    try {
      if ((await pinHash(pin.value)) === state.catalog.pinHash) { state.admin.ok = true; state.admin.fails = 0; state.admin.msg = null; return renderAdmin(); }
    } catch (e) { state.admin.msg = "aNoCrypto"; return renderAdmin(); }
    if (++state.admin.fails >= 5) { state.admin.lockUntil = Date.now() + 30000; state.admin.fails = 0; state.admin.msg = "aLocked"; }
    else state.admin.msg = "aWrong";
    renderAdmin();
  };
  pin.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  setTimeout(() => pin.focus(), 0);
  return el("div", { class: "sec" }, el("p", { text: t("aPinPrompt") }),
    el("div", { class: "row" }, el("label", { class: "f" }, el("span", { text: t("aPinLabel") }), pin),
      el("button", { class: "btn small", type: "button", text: t("aEnter"), onclick: go })), msg);
}

function adminBody() {
  const A = state.admin;
  const body = el("div", {});
  body.append(el("p", { class: "warn", text: t("aWarnPublic") }));
  if (state.dirty) body.append(el("p", { class: "note", text: "● " + t("aDirty") }));

  /* products table */
  const rows = state.catalog.products.map((p) => {
    const price = el("input", { type: "number", min: "0.01", step: "0.01", value: String(p.price), "aria-label": t("aPrice") });
    price.addEventListener("change", () => { const v = Number(price.value); if (v > 0) { p.price = v; saveDraft(); renderCatalog(); } else price.value = String(p.price); });
    const url = el("input", { type: "text", value: (p.access && p.access.url) || "", "aria-label": t("aUrl") });
    url.addEventListener("change", () => { p.access = p.access || {}; p.access.url = url.value.trim(); saveDraft(); });
    const listed = el("input", { type: "checkbox", checked: p.active !== false, "aria-label": t("aListed") });
    listed.addEventListener("change", () => { p.active = listed.checked; saveDraft(); renderCatalog(); });
    return el("tr", {},
      el("td", { text: String(p.id) }), el("td", { text: tp(p).name }),
      el("td", { style: "width:110px" }, price), el("td", {}, url), el("td", {}, listed),
      el("td", {}, el("button", { class: "btn ghost small", type: "button", text: t("aRemove"), onclick: () => {
        if (!window.confirm(t("aConfirmRemove"))) return;
        state.catalog.products = state.catalog.products.filter((q) => q !== p); saveDraft(); renderCatalog(); renderAdmin();
      } })));
  });
  body.append(el("div", { class: "sec" }, el("h3", { text: t("aProducts") }),
    el("div", { style: "overflow-x:auto" }, el("table", { class: "adm" },
      el("thead", {}, el("tr", {}, ["aId", "aName", "aPrice", "aUrl", "aListed", ""].map((k) => el("th", { text: k ? t(k) : "" })))),
      el("tbody", {}, rows))),
    el("p", { class: "note", text: t("aOnchain") })));

  /* add product */
  const nextId = Math.max(0, ...state.catalog.products.map((p) => p.id)) + 1;
  if (!A.common.id) A.common.id = String(nextId);
  const bind = (obj, key, props) => {
    const inp = props.tag === "textarea" ? el("textarea", {}) : el("input", { type: props.type || "text" });
    if (props.step) inp.step = props.step; if (props.min) inp.min = props.min;
    inp.value = obj[key] || "";
    inp.addEventListener("input", () => { obj[key] = inp.value; });
    return el("label", { class: "f" }, el("span", { text: props.label }), inp);
  };
  const catSel = el("select", { onchange: (e) => { A.common.category = e.target.value; } },
    CATEGORIES.map((c) => el("option", { value: c, text: catLabel(c), selected: c === A.common.category })));
  const textBox = el("div", {});
  const paintText = () => {
    const d = A.draft[A.lang];
    textBox.replaceChildren(
      bind(d, "name", { label: t("aFTitle") }),
      bind(d, "tagline", { label: t("aFTagline") }),
      bind(d, "what", { label: t("aFWhat"), tag: "textarea" }),
      bind(d, "problem", { label: t("aFProblem"), tag: "textarea" }),
      bind(d, "how", { label: t("aFHow") + " — " + t("aFHowHint"), tag: "textarea" }));
    textBox.style.display = "grid"; textBox.style.gap = "10px";
  };
  const tabs = el("div", { class: "tabs", role: "group" }, LANGS.map((l) => el("button", {
    class: "chip", type: "button", text: l.toUpperCase(), "aria-pressed": String(A.lang === l),
    onclick: (e) => { A.lang = l; tabs.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget))); paintText(); }
  })));
  paintText();
  const msg = el("div", { class: "status", role: "status" });
  if (A.msg) { msg.className = "status " + A.msg.kind; msg.textContent = t(A.msg.key); }

  body.append(el("div", { class: "sec" }, el("h3", { text: t("aAddTitle") }),
    el("div", { class: "row" },
      bind(A.common, "id", { label: t("aFId"), type: "number", min: "1" }),
      bind(A.common, "price", { label: t("aFPrice"), type: "number", min: "0.01", step: "0.01" }),
      el("label", { class: "f" }, el("span", { text: t("aFCategory") }), catSel)),
    el("div", { class: "row", style: "margin-top:10px" },
      bind(A.common, "url", { label: t("aFUrl") }), bind(A.common, "key", { label: t("aFKey") })),
    el("p", { class: "note", text: t("aLangHint") }), tabs, textBox,
    el("button", { class: "btn small", type: "button", style: "margin-top:12px", text: t("aAdd"), onclick: addProduct }), msg));

  /* PIN */
  const np = el("input", { type: "password", inputmode: "numeric", autocomplete: "new-password", "aria-label": t("aNewPin") });
  const pinMsg = el("div", { class: "status", role: "status" });
  body.append(el("div", { class: "sec" }, el("h3", { text: t("aSecurity") }),
    el("div", { class: "row" }, el("label", { class: "f" }, el("span", { text: t("aNewPin") }), np),
      el("button", { class: "btn small ghost", type: "button", text: t("aChangePin"), onclick: async () => {
        if (!/^\d{4,8}$/.test(np.value)) { pinMsg.className = "status err"; pinMsg.textContent = t("aPinBad"); return; }
        try { state.catalog.pinHash = await pinHash(np.value); saveDraft(); np.value = ""; pinMsg.className = "status ok"; pinMsg.textContent = t("aPinChanged"); }
        catch (e) { pinMsg.className = "status err"; pinMsg.textContent = t("aNoCrypto"); }
      } })), pinMsg));

  /* export */
  const exMsg = el("div", { class: "status", role: "status" });
  body.append(el("div", { class: "sec" }, el("h3", { text: t("aExportTitle") }),
    el("p", { class: "note", text: t("aExportHint") }),
    el("div", { class: "row" },
      el("button", { class: "btn small", type: "button", text: t("aExport"), onclick: async () => { await exportHtml(); exMsg.className = "status ok"; exMsg.textContent = t("aExported"); } }),
      el("button", { class: "btn small ghost", type: "button", text: t("aReset"), onclick: () => {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
        state.catalog = clone(CATALOG); state.dirty = false; renderCatalog(); renderAdmin();
      } })), exMsg));
  return body;
}

function addProduct() {
  const A = state.admin;
  const id = parseInt(A.common.id, 10), price = Number(A.common.price);
  const url = (A.common.url || "").trim();
  const text = {};
  for (const l of LANGS) {
    const d = A.draft[l];
    const how = (d.how || "").split("\n").map((s) => s.trim()).filter(Boolean);
    if ((d.name || "").trim() && (d.what || "").trim() && (d.problem || "").trim() && how.length) {
      text[l] = { name: d.name.trim(), tagline: (d.tagline || "").trim(), what: d.what.trim(), problem: d.problem.trim(), how };
    }
  }
  const dup = state.catalog.products.some((p) => p.id === id);
  if (!(id > 0) || dup || !(price > 0) || (url && !safeUrl(url)) || !Object.keys(text).length) {
    A.msg = { key: "aInvalid", kind: "err" };
    return renderAdmin();
  }
  state.catalog.products.push({
    id, category: A.common.category, price, active: true,
    access: { url, key: (A.common.key || "").trim(), device: false }, text
  });
  saveDraft();
  A.common = { id: "", category: A.common.category, price: "", url: "", key: "" };
  A.draft = { uz: {}, ru: {}, en: {} };
  A.msg = { key: "aAdded", kind: "ok" };
  renderCatalog();
  renderAdmin();
}

async function exportHtml() {
  let src = null;
  try {
    const r = await fetch(location.href.split("#")[0], { cache: "no-store" });
    if (r.ok) { const txt = await r.text(); if (MARK_RE.test(txt)) src = txt; }
  } catch (e) { /* e.g. file:// — fall back to the live DOM */ }
  if (!src) {
    const root = document.documentElement.cloneNode(true);
    root.querySelectorAll("[data-dynamic]").forEach((n) => n.replaceChildren());
    const ov = root.querySelector("#overlay"); if (ov) ov.setAttribute("hidden", "");
    const md = root.querySelector("#modal"); if (md) { md.replaceChildren(); md.className = "modal"; }
    if (root.querySelector("body")) root.querySelector("body").removeAttribute("style");
    src = "<!DOCTYPE html>\n" + root.outerHTML;
  }
  const json = JSON.stringify(state.catalog, null, 2).replace(/</g, "\\u003c");
  const out = src.replace(MARK_RE, () => "/*CATALOG:" + "START*/" + json + "/*CATALOG:" + "END*/");
  const a = el("a", { href: URL.createObjectURL(new Blob([out], { type: "text/html" })), download: "index.html" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ═══════════════════════════ 12. INIT ═══════════════════════════ */
function init() {
  state.catalog = loadCatalog();
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) { /* ignore */ }
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));
  applyLang(saved && I18N[saved] ? saved : "uz");   // Uzbek is the default
  refreshOnchain();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
